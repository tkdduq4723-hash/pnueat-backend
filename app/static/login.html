<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>밥약맵 - 로그인</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }
    .phone {
      width: 390px;
      min-height: 844px;
      background: #fff;
      border: 1px solid #bbb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 32px;
      gap: 0;
    }

    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 48px;
    }
    .logo-emoji { font-size: 56px; margin-bottom: 14px; }
    .logo-title { font-size: 28px; font-weight: 800; color: #111; margin-bottom: 6px; }
    .logo-sub { font-size: 14px; color: #888; text-align: center; line-height: 1.5; }

    .divider {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .divider-line { flex: 1; height: 1px; background: #eee; }
    .divider-text { font-size: 12px; color: #bbb; }

    .google-btn {
      width: 100%;
      height: 52px;
      border: 1.5px solid #ddd;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #fff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      color: #333;
      transition: background 0.15s, border-color 0.15s;
      margin-bottom: 16px;
    }
    .google-btn:hover { background: #f8f8f8; border-color: #bbb; }
    .google-btn:active { background: #f0f0f0; }

    .google-logo {
      width: 20px;
      height: 20px;
    }

    .skip-btn {
      font-size: 13px;
      color: #aaa;
      cursor: pointer;
      text-decoration: underline;
      background: none;
      border: none;
      margin-top: 8px;
    }
    .skip-btn:hover { color: #888; }

    .terms {
      font-size: 11px;
      color: #bbb;
      text-align: center;
      line-height: 1.6;
      margin-top: 32px;
    }

    .error-msg {
      font-size: 13px;
      color: #e74c3c;
      text-align: center;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="phone">

    <div class="logo-area">
      <div class="logo-emoji">🍚</div>
      <div class="logo-title">밥약맵</div>
      <div class="logo-sub">부산대 주변 맛집·카페를<br>한눈에 탐색해보세요</div>
    </div>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-text">소셜 로그인</div>
      <div class="divider-line"></div>
    </div>

    <button class="google-btn" id="googleBtn">
      <svg class="google-logo" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Google로 로그인
    </button>

    <button class="skip-btn" onclick="location.href='/'">로그인 없이 둘러보기</button>

    <div class="error-msg" id="errorMsg">로그인에 실패했어요. 다시 시도해주세요.</div>

    <div class="terms">로그인 시 서비스 이용약관 및<br>개인정보 처리방침에 동의하는 것으로 간주됩니다</div>

  </div>

  <!-- Google Identity Services -->
  <div id="g_id_onload"
    data-client_id="935729035392-9nd0kndnqma3e38i6oikp56sls4jkvur.apps.googleusercontent.com"
    data-callback="handleGoogleLogin"
    data-auto_prompt="false">
  </div>

  <script>
    function handleGoogleLogin(response) {
      fetch('/api/auth/google', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: response.credential }),
      })
        .then(r => r.json())
        .then(data => {
          if (data.token) {
            localStorage.setItem('jwt', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            // 북마크 로컬 → 서버 동기화
            const localBookmarks = JSON.parse(localStorage.getItem('bookmarks') || '[]');
            if (localBookmarks.length > 0) {
              fetch('/api/auth/bookmarks', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${data.token}`,
                },
                body: JSON.stringify({ bookmarks: localBookmarks }),
              });
            }
            const redirect = new URLSearchParams(location.search).get('from') || '/';
            location.href = redirect;
          }
        })
        .catch(() => {
          document.getElementById('errorMsg').style.display = 'block';
        });
    }

    document.getElementById('googleBtn').addEventListener('click', () => {
      google.accounts.id.initialize({
        client_id: '935729035392-9nd0kndnqma3e38i6oikp56sls4jkvur.apps.googleusercontent.com',
        callback: handleGoogleLogin,
      });
      google.accounts.id.prompt();
    });
  </script>
</body>
</html>
