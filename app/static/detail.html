<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>밥약맵 - 식당 상세</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }
    .phone {
      width: 390px;
      height: 844px;
      background: #fff;
      border: 1px solid #bbb;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* 히어로 */
    .hero {
      width: 100%;
      height: 220px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      font-size: 72px;
    }
    .hero-back {
      position: absolute;
      top: 16px; left: 16px;
      width: 34px; height: 34px;
      background: rgba(0,0,0,0.35);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .hero-save {
      position: absolute;
      top: 16px; right: 16px;
      width: 34px; height: 34px;
      background: rgba(0,0,0,0.35);
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    /* 스크롤 영역 */
    .scroll-body { flex: 1; overflow-y: auto; min-height: 0; }

    /* 기본 정보 */
    .info-section {
      padding: 16px 16px 14px;
      border-bottom: 1px solid #eee;
    }
    .rest-name { font-size: 20px; font-weight: 700; color: #111; margin-bottom: 4px; }
    .cat-badge {
      display: inline-block;
      font-size: 11px; color: #555;
      background: #f2f2f2;
      border-radius: 4px;
      padding: 3px 8px;
      margin-bottom: 12px;
    }
    .tags-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .tag {
      font-size: 11px; color: #555;
      background: #f2f2f2;
      border-radius: 12px;
      padding: 4px 10px;
    }
    .tag.dark { background: #222; color: #fff; }
    .tag.green { background: #f0faf3; color: #34a853; }
    .tag.blue { background: #f0f7ff; color: #1a73e8; }
    .tag.yellow { background: #fffbeb; color: #f59e0b; }
    .info-row {
      display: flex; align-items: center;
      gap: 10px; margin-bottom: 8px;
    }
    .info-icon { font-size: 14px; flex-shrink: 0; width: 18px; text-align: center; }
    .info-text { font-size: 13px; color: #444; }
    .info-text.light { color: #888; }

    /* 섹션 공통 */
    .section { padding: 14px 16px; border-bottom: 1px solid #eee; }
    .section-title { font-size: 14px; font-weight: 700; color: #111; margin-bottom: 10px; }

    /* 에브리타임 */
    .review-placeholder {
      background: #f8f8f8;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      font-size: 14px;
      color: #aaa;
    }

    /* 지도 */
    #detailMap {
      width: 100%;
      height: 140px;
      border-radius: 8px;
      overflow: hidden;
      background: #eee;
    }

    /* 비슷한 식당 */
    .similar-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
    }
    .similar-scroll::-webkit-scrollbar { display: none; }
    .similar-card {
      flex-shrink: 0;
      width: 100px;
      cursor: pointer;
    }
    .similar-card:active { opacity: 0.7; }
    .similar-thumb {
      width: 100px; height: 76px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      margin-bottom: 6px;
    }
    .similar-name { font-size: 12px; font-weight: 600; color: #111; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .similar-dist { font-size: 11px; color: #aaa; }

    /* 하단 CTA */
    .bottom-cta {
      padding: 12px 16px 20px;
      display: flex;
      gap: 8px;
      border-top: 1px solid #ddd;
      background: #fff;
      flex-shrink: 0;
    }
    .cta-secondary {
      flex: 1; height: 46px;
      border: 1.5px solid #ccc;
      border-radius: 10px;
      background: #fff;
      font-size: 13px; color: #555;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    .cta-secondary:active { background: #f8f8f8; }
    .cta-primary {
      flex: 2; height: 46px;
      background: #111; border: none;
      border-radius: 10px;
      font-size: 14px; font-weight: 700; color: #fff;
      cursor: pointer;
    }
    .cta-primary:active { opacity: 0.8; }

    /* 토스트 */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%; transform: translateX(-50%);
      background: #111; color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px; font-weight: 600;
      z-index: 300;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    /* 저장 모달 */
    .save-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 200;
      justify-content: center;
      align-items: flex-end;
    }
    .save-overlay.open { display: flex; }
    .save-sheet {
      width: 390px;
      background: #fff;
      border-radius: 16px 16px 0 0;
      padding: 20px 20px 32px;
      animation: slideUp 0.22s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet-handle { width: 36px; height: 4px; background: #ddd; border-radius: 2px; margin: 0 auto 16px; }
    .sheet-title { font-size: 15px; font-weight: 700; color: #111; margin-bottom: 14px; text-align: center; }
    .save-option {
      width: 100%; height: 50px;
      border: 1.5px solid #eee;
      border-radius: 10px;
      background: #fff;
      font-size: 14px; color: #333;
      cursor: pointer;
      display: flex; align-items: center; gap: 10px;
      padding: 0 16px;
      margin-bottom: 8px;
    }
    .save-option:active { background: #f8f8f8; }
    .save-option.active { border-color: #111; background: #f5f5f5; font-weight: 700; }
    .save-option.cancel { color: #aaa; border-color: #f0f0f0; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="phone">

    <div class="hero" id="hero">
      <button class="hero-back" onclick="history.back()">←</button>
      <div id="heroEmoji">🍽</div>
      <button class="hero-save" id="heroSaveBtn" onclick="openSaveModal()">🤍</button>
    </div>

    <div class="scroll-body">

      <div class="info-section">
        <div class="rest-name" id="restName">-</div>
        <div class="cat-badge" id="catBadge"></div>
        <div class="tags-row" id="tagsRow"></div>
        <div id="infoRows"></div>
      </div>

      <div class="section">
        <div class="section-title">에브리타임 후기 요약</div>
        <div class="review-placeholder">🛠 준비 중입니다</div>
      </div>

      <div class="section">
        <div class="section-title">위치</div>
        <div id="detailMap"></div>
      </div>

      <div class="section">
        <div class="section-title">비슷한 식당</div>
        <div class="similar-scroll" id="similarScroll">
          <div style="font-size:13px;color:#aaa">불러오는 중...</div>
        </div>
      </div>

    </div>

    <div class="bottom-cta">
      <button class="cta-secondary" onclick="openSaveModal()">🔖 저장</button>
      <button class="cta-secondary" onclick="shareItem()">📤 공유</button>
      <button class="cta-primary" onclick="navigate()">길찾기</button>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <!-- 저장 모달 -->
  <div class="save-overlay" id="saveOverlay" onclick="closeSaveModal()">
    <div class="save-sheet" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <div class="sheet-title">어떤 목록에 추가할까요?</div>
      <button class="save-option" id="optSaved" onclick="toggleList('saved')">🔖 저장한 곳</button>
      <button class="save-option" id="optVisited" onclick="toggleList('visited')">✅ 가본 곳</button>
      <button class="save-option cancel" onclick="closeSaveModal()">닫기</button>
    </div>
  </div>

  <script src="/static/auth.js"></script>
  <script>
    const CAT_EMOJI = {
      '한식':'🍚','일식':'🍣','중식':'🥡','양식':'🍝','치킨':'🍗',
      '피자·버거':'🍔','분식':'🥢','고기·구이':'🥩','돈까스·회':'🍱',
      '카페·디저트':'☕','기타':'🍽'
    };
    const HERO_COLORS = {
      '한식':'#2d5a27,#4a8f3f','일식':'#1a3a6b,#2d5fa3','중식':'#8b2e00,#c4511a',
      '양식':'#4a2080,#7c3aed','치킨':'#b45309,#d97706','피자·버거':'#c2410c,#ea580c',
      '분식':'#be185d,#db2777','고기·구이':'#7f1d1d,#b91c1c','돈까스·회':'#164e63,#0e7490',
      '카페·디저트':'#78350f,#92400e','기타':'#374151,#6b7280'
    };
    const PNU = { lat: 35.2323, lng: 129.0876 };

    let item = null;
    let bookmarks = JSON.parse(localStorage.getItem('bookmarks') || '[]');
    let visited = JSON.parse(localStorage.getItem('visited') || '[]');

    function isBookmarked() { return item && bookmarks.includes(item['이름']); }
    function isVisited() { return item && visited.includes(item['이름']); }

    /* ── 아이템 로드 ── */
    function loadItem() {
      try {
        item = JSON.parse(sessionStorage.getItem('detailItem'));
      } catch {}
      if (!item) { history.back(); return; }
      renderDetail();
      loadSimilar();
      loadMap();
    }

    /* ── 상세 렌더 ── */
    function renderDetail() {
      const cat = item['대분류'] || item['카테고리'] || '';
      const emoji = cat === '카페·디저트' || item._type === 'cafe' ? '☕' : (CAT_EMOJI[cat] || '🍽');
      const colors = (HERO_COLORS[cat] || '374151,6b7280').split(',');

      document.getElementById('hero').style.background =
        `linear-gradient(135deg, #${colors[0]}, #${colors[1]})`;
      document.getElementById('heroEmoji').textContent = emoji;
      document.getElementById('restName').textContent = item['이름'];
      document.getElementById('catBadge').textContent = cat + (item['카테고리'] && item['카테고리'] !== cat ? ' · ' + item['카테고리'] : '');

      // 태그
      const tags = [];
      if (item['도보시간'] && item['도보시간'] !== '-')
        tags.push(`<span class="tag green">🚶 ${item['도보시간']}</span>`);
      if (item['거리(m)'] && item['거리(m)'] !== '-')
        tags.push(`<span class="tag">${item['거리(m)']}m</span>`);
      if (item['가격'])
        tags.push(`<span class="tag blue">💳 ${parseInt(item['가격']).toLocaleString()}원</span>`);
      if (item['별점'] != null)
        tags.push(`<span class="tag yellow">★ ${item['별점']} (${item['리뷰수'] ?? 0}개)</span>`);
      document.getElementById('tagsRow').innerHTML = tags.join('');

      // 정보 행
      const rows = [];
      if (item['주소']) rows.push(`<div class="info-row"><div class="info-icon">📍</div><div class="info-text">${item['주소']}</div></div>`);
      if (item['전화번호']) rows.push(`<div class="info-row"><div class="info-icon">📞</div><a class="info-text" href="tel:${item['전화번호']}" style="color:#1a73e8;text-decoration:none">${item['전화번호']}</a></div>`);
      if (item['운영시간']?.length) {
        const today = [6,0,1,2,3,4,5][new Date().getDay()]; // 월=0 기준
        const todayText = item['운영시간'][today] || '';
        const timeShort = todayText.replace(/^[^:]+:\s*/, '');
        rows.push(`<div class="info-row"><div class="info-icon">🕐</div><div class="info-text">오늘 ${timeShort}</div></div>`);
      }
      rows.push(`<div class="info-row"><div class="info-icon">🏷</div><div class="info-text light">${item['출처']} 데이터</div></div>`);
      document.getElementById('infoRows').innerHTML = rows.join('');

      updateSaveIcon();
    }

    function updateSaveIcon() {
      document.getElementById('heroSaveBtn').textContent = (isBookmarked() || isVisited()) ? '🔖' : '🤍';
    }

    /* ── 저장 모달 ── */
    function openSaveModal() {
      document.getElementById('optSaved').classList.toggle('active', isBookmarked());
      document.getElementById('optVisited').classList.toggle('active', isVisited());
      document.getElementById('saveOverlay').classList.add('open');
    }
    function closeSaveModal() {
      document.getElementById('saveOverlay').classList.remove('open');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function toggleList(type) {
      if (!item) return;
      const name = item['이름'];
      if (type === 'saved') {
        const current = JSON.parse(localStorage.getItem('bookmarks') || '[]');
        const i = current.indexOf(name);
        if (i === -1) { current.push(name); showToast('저장한 곳에 추가됐어요 🔖'); }
        else { current.splice(i, 1); showToast('저장한 곳에서 삭제됐어요'); }
        bookmarks = current;
        localStorage.setItem('bookmarks', JSON.stringify(current));
        pushBookmarks(current);
      } else {
        const current = JSON.parse(localStorage.getItem('visited') || '[]');
        const i = current.indexOf(name);
        if (i === -1) { current.push(name); showToast('가본 곳에 추가됐어요 ✅'); }
        else { current.splice(i, 1); showToast('가본 곳에서 삭제됐어요'); }
        visited = current;
        localStorage.setItem('visited', JSON.stringify(current));
      }
      updateSaveIcon();
      closeSaveModal();
    }

    /* ── 길찾기 ── */
    function navigate() {
      const lat = item.lat, lng = item.lng;
      if (lat && Math.abs(lat - PNU.lat) > 0.0002) {
        window.open(`https://www.google.com/maps/dir/?api=1&origin=${PNU.lat},${PNU.lng}&destination=${lat},${lng}&travelmode=walking`);
      } else {
        window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item['이름'] + ' 부산 금정구')}`);
      }
    }

    /* ── 공유 ── */
    function shareItem() {
      const text = `${item['이름']} - 밥약맵에서 확인`;
      if (navigator.share) {
        navigator.share({ title: item['이름'], text, url: location.href }).catch(() => {});
      } else {
        navigator.clipboard?.writeText(text).then(() => alert('클립보드에 복사됐어요!'));
      }
    }

    /* ── 비슷한 식당 ── */
    async function loadSimilar() {
      try {
        const [food, cafe] = await Promise.all([
          fetch('/api/food').then(r => r.json()),
          fetch('/api/cafe').then(r => r.json()),
        ]);
        const cat = item['대분류'];
        const all = [...food.map(i=>({...i,_type:'food'})), ...cafe.map(i=>({...i,_type:'cafe'}))];
        const similar = all
          .filter(i => i['이름'] !== item['이름'] && i['대분류'] === cat)
          .sort((a,b) => {
            const da = parseInt(a['거리(m)']) || 9999;
            const db = parseInt(b['거리(m)']) || 9999;
            return da - db;
          })
          .slice(0, 6);

        if (similar.length === 0) {
          document.getElementById('similarScroll').innerHTML = '<div style="font-size:13px;color:#aaa">비슷한 식당이 없어요</div>';
          return;
        }

        document.getElementById('similarScroll').innerHTML = similar.map(s => {
          const em = CAT_EMOJI[s['대분류']] || (s._type === 'cafe' ? '☕' : '🍽');
          const colors = (HERO_COLORS[s['대분류']] || '374151,6b7280').split(',');
          const dist = s['거리(m)'] !== '-' ? s['도보시간'] : '';
          return `
            <div class="similar-card" onclick="openSimilar(${JSON.stringify(s).replace(/"/g,'&quot;')})">
              <div class="similar-thumb" style="background:linear-gradient(135deg,#${colors[0]},#${colors[1]})">${em}</div>
              <div class="similar-name">${s['이름']}</div>
              <div class="similar-dist">${dist}</div>
            </div>`;
        }).join('');
      } catch {}
    }

    function openSimilar(s) {
      sessionStorage.setItem('detailItem', JSON.stringify(s));
      location.reload();
    }

    /* ── 지도 헬퍼 ── */
    function loadKakaoSDK(key) {
      return new Promise((resolve, reject) => {
        if (window.kakao?.maps) { resolve(); return; }
        const timer = setTimeout(() => reject(new Error('timeout')), 8000);
        const s = document.createElement('script');
        s.onload = () => { clearTimeout(timer); resolve(); };
        s.onerror = () => { clearTimeout(timer); reject(new Error('error')); };
        s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${key}&autoload=false`;
        document.head.appendChild(s);
      });
    }

    function loadGoogleSDK(key) {
      return new Promise((resolve, reject) => {
        if (window.google?.maps) { resolve(); return; }
        const timer = setTimeout(() => reject(new Error('timeout')), 8000);
        window.__gmDetailInit = () => { clearTimeout(timer); resolve(); };
        const s = document.createElement('script');
        s.onerror = () => { clearTimeout(timer); reject(new Error('error')); };
        s.src = `https://maps.googleapis.com/maps/api/js?key=${key}&callback=__gmDetailInit&language=ko`;
        document.head.appendChild(s);
      });
    }

    function showMapFallback(mapDiv) {
      const kakaoUrl = `https://map.kakao.com/link/search/${encodeURIComponent(item['이름'] || '')}`;
      const googleUrl = (item.lat && item.lng)
        ? `https://www.google.com/maps?q=${item.lat},${item.lng}`
        : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((item['이름'] || '') + ' ' + (item['주소'] || ''))}`;
      mapDiv.innerHTML = `
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;background:#f8f8f8;border-radius:8px;padding:16px">
          <div style="font-size:12px;color:#555;text-align:center">📍 ${item['주소'] || '주소 정보 없음'}</div>
          <div style="display:flex;gap:8px">
            <a href="${kakaoUrl}" target="_blank" style="font-size:12px;background:#FFCD00;color:#3C1E1E;padding:7px 14px;border-radius:8px;text-decoration:none;font-weight:700">카카오맵</a>
            <a href="${googleUrl}" target="_blank" style="font-size:12px;background:#4285F4;color:#fff;padding:7px 14px;border-radius:8px;text-decoration:none;font-weight:700">구글맵</a>
          </div>
        </div>`;
    }

    /* ── 지도 ── */
    async function loadMap() {
      const mapDiv = document.getElementById('detailMap');

      if (!item.lat || !item.lng) {
        mapDiv.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#aaa;font-size:13px">위치 정보 없음</div>';
        return;
      }

      let cfg = {};
      try { cfg = await fetch('/api/config').then(r => r.json()); } catch {}

      // 카카오맵 시도 (1순위)
      if (cfg.kakao_key) {
        try {
          await loadKakaoSDK(cfg.kakao_key);
          await new Promise(resolve => kakao.maps.load(resolve));

          const center = new kakao.maps.LatLng(item.lat, item.lng);
          const map = new kakao.maps.Map(mapDiv, { center, level: 4 });

          const marker = new kakao.maps.Marker({ position: center, map });
          const infowindow = new kakao.maps.InfoWindow({
            content: `<div style="padding:5px 10px;font-size:12px;font-weight:700;white-space:nowrap">${item['이름']}</div>`
          });
          infowindow.open(map, marker);

          const pnuPos = new kakao.maps.LatLng(PNU.lat, PNU.lng);
          const pnuMarker = new kakao.maps.Marker({ position: pnuPos, map });
          new kakao.maps.InfoWindow({
            content: '<div style="padding:4px 8px;font-size:11px;white-space:nowrap">부산대 정문</div>'
          }).open(map, pnuMarker);

          const bounds = new kakao.maps.LatLngBounds();
          bounds.extend(center);
          bounds.extend(pnuPos);
          map.setBounds(bounds);
          return;
        } catch {}
      }

      // 구글맵 폴백 (2순위)
      if (cfg.google_maps_key) {
        try {
          await loadGoogleSDK(cfg.google_maps_key);

          const map = new google.maps.Map(mapDiv, {
            center: { lat: item.lat, lng: item.lng },
            zoom: 16,
            disableDefaultUI: true,
            zoomControl: true,
          });

          new google.maps.Marker({
            position: { lat: item.lat, lng: item.lng }, map,
            icon: { path: google.maps.SymbolPath.CIRCLE, scale: 12, fillColor: '#ea4335', fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2 },
            title: item['이름'],
          });
          new google.maps.Marker({
            position: PNU, map,
            icon: { path: google.maps.SymbolPath.CIRCLE, scale: 8, fillColor: '#111', fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2 },
            title: '부산대 정문',
          });

          const renderer = new google.maps.DirectionsRenderer({
            map, suppressMarkers: true,
            polylineOptions: { strokeColor: '#1a73e8', strokeWeight: 4 },
          });
          new google.maps.DirectionsService().route({
            origin: PNU,
            destination: { lat: item.lat, lng: item.lng },
            travelMode: google.maps.TravelMode.WALKING,
          }, (result, status) => {
            if (status !== 'OK') return;
            renderer.setDirections(result);
            const bounds = new google.maps.LatLngBounds();
            result.routes[0].legs[0].steps.forEach(s => {
              bounds.extend(s.start_location);
              bounds.extend(s.end_location);
            });
            map.fitBounds(bounds);
          });
          return;
        } catch {}
      }

      // 최종 폴백: 주소 + 외부 링크
      showMapFallback(mapDiv);
    }

    loadItem();
    syncBookmarks().then(() => {
      bookmarks = JSON.parse(localStorage.getItem('bookmarks') || '[]');
      updateSaveIcon();
    });
  </script>
</body>
</html>
