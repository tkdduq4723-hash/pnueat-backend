<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>밥약맵 - 오늘 추천</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }
    .phone {
      width: 390px;
      min-height: 844px;
      background: #fff;
      border: 1px solid #bbb;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 20px 16px 16px;
      border-bottom: 1px solid #eee;
    }
    .header-title { font-size: 20px; font-weight: 800; color: #111; }
    .header-sub { font-size: 13px; color: #888; margin-top: 4px; }

    .content { flex: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; }

    /* 추천 카드 */
    .rec-card {
      background: #fff;
      border: 1.5px solid #eee;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .rec-card-header {
      padding: 14px 16px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #f4f4f4;
    }

    .rec-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .rec-badge.food { background: #111; color: #fff; }
    .rec-badge.cafe { background: #f0f7ff; color: #1a73e8; }

    .rec-card-body { padding: 16px; }

    .rec-thumb {
      width: 100%;
      height: 120px;
      background: #f4f4f4;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      margin-bottom: 14px;
    }

    .rec-name { font-size: 20px; font-weight: 800; color: #111; margin-bottom: 6px; }
    .rec-cat {
      display: inline-block;
      font-size: 12px;
      background: #f2f2f2;
      color: #555;
      padding: 3px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .rec-addr { font-size: 13px; color: #888; margin-bottom: 6px; }
    .rec-dist { font-size: 14px; color: #34a853; font-weight: 700; }

    /* 다시 추천 버튼 */
    .shuffle-btn {
      width: 100%;
      height: 52px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.15s;
    }
    .shuffle-btn:active { opacity: 0.8; }

    .loading-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #aaa;
      font-size: 14px;
    }
    .loading-emoji { font-size: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 하단 네비 */
    .bottom-nav {
      display: flex;
      border-top: 1px solid #ddd;
      background: #fff;
      padding: 8px 0 16px;
      margin-top: auto;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .nav-icon { font-size: 20px; color: #ccc; }
    .nav-item.active .nav-icon { color: #111; }
    .nav-label { font-size: 10px; color: #aaa; }
    .nav-item.active .nav-label { color: #111; font-weight: 700; }
  </style>
</head>
<body>
  <div class="phone">

    <div class="header">
      <div class="header-title">✨ 오늘의 추천</div>
      <div class="header-sub">주변 식당 중 랜덤으로 골라드려요</div>
    </div>

    <div class="content" id="content">
      <div class="loading-state">
        <div class="loading-emoji">🎲</div>
        <div>추천 중...</div>
      </div>
    </div>

    <div class="bottom-nav">
      <div class="nav-item" onclick="location.href='/'">
        <div class="nav-icon">🏠</div>
        <div class="nav-label">홈</div>
      </div>
      <div class="nav-item" onclick="location.href='/search'">
        <div class="nav-icon">🔍</div>
        <div class="nav-label">탐색</div>
      </div>
      <div class="nav-item active">
        <div class="nav-icon">✨</div>
        <div class="nav-label">추천</div>
      </div>
      <div class="nav-item" onclick="location.href='/mylist'">
        <div class="nav-icon">🔖</div>
        <div class="nav-label">내 목록</div>
      </div>
    </div>

  </div>

  <script>
    const catEmoji = {
      '돈까스·회': '🍱', '한식': '🍚', '치킨': '🍗', '피자·버거': '🍔',
      '분식': '🥢', '중식': '🥡', '일식': '🍣', '양식': '🍝',
      '고기·구이': '🥩', '카페·디저트': '☕', '기타': '🍽'
    };

    function recCardHTML(item, type) {
      const emoji = type === 'cafe' ? '☕' : (catEmoji[item['대분류']] || '🍽');
      const dist = item['거리(m)'] !== '-' ? `🚶 ${item['도보시간']} (${item['거리(m)']}m)` : '';
      return `
        <div class="rec-card">
          <div class="rec-card-header">
            <span class="rec-badge ${type}">${type === 'cafe' ? '☕ 카페' : '🍽 밥집'}</span>
          </div>
          <div class="rec-card-body">
            <div class="rec-thumb">${emoji}</div>
            <div class="rec-name">${item['이름']}</div>
            <div class="rec-cat">${item['대분류'] || item['카테고리'] || ''}</div>
            <div class="rec-addr">📍 ${item['주소'] || '-'}</div>
            ${dist ? `<div class="rec-dist">${dist}</div>` : ''}
          </div>
        </div>
      `;
    }

    async function getRecommend() {
      document.getElementById('content').innerHTML = `
        <div class="loading-state">
          <div class="loading-emoji">🎲</div>
          <div>추천 중...</div>
        </div>`;
      try {
        const data = await fetch('/api/recommend').then(r => r.json());
        document.getElementById('content').innerHTML = `
          ${data['밥집'] ? recCardHTML(data['밥집'], 'food') : ''}
          ${data['카페'] ? recCardHTML(data['카페'], 'cafe') : ''}
          <button class="shuffle-btn" onclick="getRecommend()">🎲 다시 추천받기</button>
        `;
      } catch {
        document.getElementById('content').innerHTML = `
          <div class="loading-state">
            <div>😅</div>
            <div>추천을 불러오지 못했어요</div>
          </div>`;
      }
    }

    getRecommend();
  </script>
</body>
</html>
