<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>밥약맵 - 맞춤 추천</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }
    .phone {
      width: 390px;
      min-height: 844px;
      background: #fff;
      border: 1px solid #bbb;
      display: flex;
      flex-direction: column;
    }

    /* 헤더 */
    .header {
      padding: 16px 16px 12px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .header-title { font-size: 17px; font-weight: 700; color: #111; margin-bottom: 4px; }
    .header-sub { font-size: 12px; color: #888; }

    /* 스텝 바 */
    .step-bar {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #eee;
    }
    .step { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .step-circle {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: #ddd;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
      color: #888;
      transition: background 0.2s;
    }
    .step-circle.done { background: #555; color: #fff; }
    .step-circle.active { background: #111; color: #fff; }
    .step-label { font-size: 10px; color: #aaa; white-space: nowrap; }
    .step-label.active { color: #111; font-weight: 700; }
    .step-line { flex: 1; height: 1px; background: #ddd; margin-bottom: 18px; transition: background 0.2s; }
    .step-line.done { background: #555; }

    /* 질문 영역 */
    .question-section { flex: 1; padding: 20px 16px; overflow-y: auto; }
    .question-title { font-size: 16px; font-weight: 700; color: #111; margin-bottom: 6px; line-height: 1.4; }
    .question-sub { font-size: 12px; color: #888; margin-bottom: 16px; }

    /* 선택 카드 2x2 */
    .choice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 24px;
    }
    .choice-card {
      border: 1.5px solid #ddd;
      border-radius: 12px;
      padding: 16px 12px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .choice-card:active { opacity: 0.7; }
    .choice-card.selected { border-color: #111; background: #f5f5f5; }
    .choice-icon { font-size: 28px; }
    .choice-label { font-size: 13px; font-weight: 600; color: #444; text-align: center; }
    .choice-card.selected .choice-label { color: #111; }
    .choice-sub { font-size: 11px; color: #aaa; text-align: center; }
    .choice-card.selected .choice-sub { color: #666; }

    /* 거리 칩 */
    .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      padding: 8px 16px;
      border: 1.5px solid #ddd;
      border-radius: 20px;
      font-size: 13px; color: #555;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .chip.selected { border-color: #111; background: #111; color: #fff; }
    .chip:active { opacity: 0.7; }

    /* 체크 그리드 (카테고리) */
    .check-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 24px;
    }
    .check-item {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 12px;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .check-item.checked { border-color: #111; background: #f5f5f5; }
    .checkbox {
      width: 18px; height: 18px;
      border-radius: 4px;
      background: #ddd;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: #fff;
    }
    .check-item.checked .checkbox { background: #111; }
    .check-text { font-size: 13px; color: #555; }
    .check-item.checked .check-text { color: #111; font-weight: 600; }

    /* 앞서 선택한 내용 요약 */
    .summary-box {
      background: #f8f8f8;
      border-radius: 10px;
      padding: 12px 14px;
    }
    .summary-label { font-size: 11px; color: #888; margin-bottom: 6px; }
    .summary-text { font-size: 13px; color: #333; }

    /* 결과 카드 */
    .result-card {
      border: 1.5px solid #eee;
      border-radius: 14px;
      padding: 14px;
      display: flex;
      gap: 12px;
      margin-bottom: 10px;
    }
    .result-rank {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: #111;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .result-rank.silver { background: #888; }
    .result-rank.bronze { background: #b87333; }
    .result-info { flex: 1; min-width: 0; }
    .result-name {
      font-size: 15px; font-weight: 700; color: #111;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .result-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 6px; }
    .result-tag { font-size: 11px; background: #f2f2f2; color: #555; padding: 2px 7px; border-radius: 4px; }
    .result-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-top: 3px; }
    .result-dist { color: #34a853; font-weight: 600; }
    .result-score { color: #7c3aed; font-weight: 700; font-size: 13px; }
    .result-price { color: #888; }
    .result-rating { color: #f59e0b; font-weight: 600; }
    .score-breakdown { display: flex; flex-direction: column; gap: 5px; }
    .mini-score-row { display: flex; align-items: center; gap: 6px; }
    .mini-score-label { font-size: 11px; color: #888; width: 22px; flex-shrink: 0; }
    .mini-score-track { flex: 1; height: 5px; background: #eee; border-radius: 3px; overflow: hidden; }
    .mini-score-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
    .mini-score-val { font-size: 11px; color: #555; font-weight: 600; width: 22px; text-align: right; flex-shrink: 0; }

    .restart-btn {
      width: 100%; height: 46px;
      background: #f4f4f4; border: none;
      border-radius: 12px;
      font-size: 14px; font-weight: 700; color: #555;
      cursor: pointer; margin-top: 4px;
    }
    .restart-btn:active { opacity: 0.7; }

    .empty-state { text-align: center; padding: 48px 20px; }
    .empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }
    .empty-state .empty-text { font-size: 14px; color: #aaa; line-height: 1.6; }

    /* 하단 버튼 */
    .bottom-btn-area {
      padding: 12px 16px 16px;
      border-top: 1px solid #eee;
      display: flex;
      gap: 8px;
    }
    .btn-prev {
      width: 48px; height: 48px;
      border: 1.5px solid #ccc; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 18px; color: #888; flex-shrink: 0;
    }
    .btn-prev:active { opacity: 0.7; }
    .btn-next {
      flex: 1; height: 48px;
      background: #111; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700; color: #fff;
      cursor: pointer;
    }
    .btn-next:disabled { background: #ccc; cursor: not-allowed; }
    .btn-next:active:not(:disabled) { opacity: 0.8; }

    /* 하단 네비 */
    .bottom-nav {
      display: flex;
      border-top: 1px solid #ddd;
      background: #fff;
      padding: 8px 0 16px;
    }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
    .nav-icon { font-size: 20px; color: #ccc; }
    .nav-item.active .nav-icon { color: #111; }
    .nav-label { font-size: 10px; color: #aaa; }
    .nav-item.active .nav-label { color: #111; font-weight: 700; }
  </style>
</head>
<body>
  <div class="phone">

    <div class="header">
      <div>
        <div class="header-title">✨ 맞춤 추천</div>
        <div class="header-sub">몇 가지 질문으로 딱 맞는 식당을 찾아드려요</div>
      </div>
      <div style="position:relative" id="authArea"></div>
    </div>

    <div class="step-bar" id="stepBar"></div>
    <div class="question-section" id="questionSection"></div>
    <div class="bottom-btn-area" id="bottomBtns"></div>

    <div class="bottom-nav">
      <div class="nav-item" onclick="location.href='/'">
        <div class="nav-icon">🏠</div><div class="nav-label">홈</div>
      </div>
      <div class="nav-item" onclick="location.href='/search'">
        <div class="nav-icon">🔍</div><div class="nav-label">탐색</div>
      </div>
      <div class="nav-item active">
        <div class="nav-icon">✨</div><div class="nav-label">추천</div>
      </div>
      <div class="nav-item" onclick="location.href='/mylist'">
        <div class="nav-icon">🔖</div><div class="nav-label">내 목록</div>
      </div>
    </div>

  </div>

  <script src="/static/auth.js"></script>
  <script>
    const CAT_EMOJI = {
      '한식':'🍚','일식':'🍣','중식':'🥡','양식':'🍝','치킨':'🍗',
      '피자·버거':'🍔','분식':'🥢','고기·구이':'🥩','돈까스·회':'🍱','기타':'🍽'
    };
    const CATS = ['한식','일식','중식','양식','치킨','피자·버거','분식','고기·구이','돈까스·회'];
    const STEP_LABELS = ['상황','예산','음식','결과'];

    const state = {
      step: 1,
      situation: null,
      maxDist: null,
      maxBudget: null,
      categories: [],
      foodData: [],
    };

    /* ── 스텝 바 ── */
    function renderStepBar() {
      document.getElementById('stepBar').innerHTML = STEP_LABELS.map((label, i) => {
        const n = i + 1;
        const done = n < state.step;
        const active = n === state.step;
        const line = i < STEP_LABELS.length - 1
          ? `<div class="step-line ${done ? 'done' : ''}"></div>` : '';
        return `
          <div class="step">
            <div class="step-circle ${done ? 'done' : active ? 'active' : ''}">${done ? '✓' : n}</div>
            <div class="step-label ${active ? 'active' : ''}">${label}</div>
          </div>${line}`;
      }).join('');
    }

    /* ── 요약 텍스트 ── */
    function summaryText() {
      const distMap = {400:'도보 5분 이내', 800:'도보 10분 이내', 1200:'도보 15분 이내', 99999:'거리 무관'};
      const budgetMap = {7000:'7천원 이내', 10000:'1만원 이내', 15000:'1.5만원 이내', 99999:'예산 무관'};
      return [
        state.situation,
        state.maxDist != null ? distMap[state.maxDist] : null,
        state.maxBudget != null ? budgetMap[state.maxBudget] : null,
      ].filter(Boolean).join(' · ') || '-';
    }

    /* ── 스텝 1: 상황 ── */
    function renderStep1() {
      const sits = [
        {label:'선후배 1:1', icon:'🤝', sub:'둘이서'},
        {label:'선후배 1:2', icon:'👥', sub:'셋이서'},
        {label:'선후배 2:2', icon:'👫', sub:'넷이서'},
        {label:'단체모임', icon:'🎉', sub:'다 같이'},
      ];
      const dists = [
        {label:'5분 이내', val:400},
        {label:'10분 이내', val:800},
        {label:'15분 이내', val:1200},
        {label:'상관없음', val:99999},
      ];
      return `
        <div class="question-title">오늘 누구랑 먹어요?</div>
        <div class="question-sub">상황에 맞는 식당을 추천해드려요</div>
        <div class="choice-grid">
          ${sits.map(s => `
            <div class="choice-card ${state.situation === s.label ? 'selected' : ''}"
                 onclick="pick('situation','${s.label}')">
              <div class="choice-icon">${s.icon}</div>
              <div class="choice-label">${s.label}</div>
              <div class="choice-sub">${s.sub}</div>
            </div>`).join('')}
        </div>
        <div class="question-title" style="margin-bottom:10px">얼마나 걸어갈 수 있어요?</div>
        <div class="chip-row">
          ${dists.map(d => `
            <div class="chip ${state.maxDist === d.val ? 'selected' : ''}"
                 onclick="pick('maxDist',${d.val})">${d.label}</div>`).join('')}
        </div>`;
    }

    /* ── 스텝 2: 예산 ── */
    function renderStep2() {
      const budgets = [
        {label:'7천원 이내', sub:'가성비 최우선', icon:'💸', val:7000},
        {label:'1만원 이내', sub:'적당한 한 끼', icon:'💳', val:10000},
        {label:'1.5만원 이내', sub:'조금 여유 있게', icon:'💰', val:15000},
        {label:'상관없음', sub:'맛이 최우선', icon:'🍽', val:99999},
      ];
      return `
        <div class="question-title">1인당 예산은요?</div>
        <div class="question-sub">가격 정보가 없는 식당도 함께 포함돼요</div>
        <div class="choice-grid">
          ${budgets.map(b => `
            <div class="choice-card ${state.maxBudget === b.val ? 'selected' : ''}"
                 onclick="pick('maxBudget',${b.val})">
              <div class="choice-icon">${b.icon}</div>
              <div class="choice-label">${b.label}</div>
              <div class="choice-sub">${b.sub}</div>
            </div>`).join('')}
        </div>
        <div class="summary-box">
          <div class="summary-label">앞서 선택한 내용</div>
          <div class="summary-text">${summaryText()}</div>
        </div>`;
    }

    /* ── 스텝 3: 음식 종류 ── */
    function renderStep3() {
      return `
        <div class="question-title">어떤 음식이 당기나요?</div>
        <div class="question-sub">여러 개 선택 가능 · 선택 안 하면 전체 포함</div>
        <div class="check-grid">
          ${CATS.map(cat => {
            const on = state.categories.includes(cat);
            return `
              <div class="check-item ${on ? 'checked' : ''}" onclick="toggleCat('${cat}')">
                <div class="checkbox">${on ? '✓' : ''}</div>
                <div class="check-text">${CAT_EMOJI[cat] || ''} ${cat}</div>
              </div>`;
          }).join('')}
        </div>
        <div class="summary-box">
          <div class="summary-label">앞서 선택한 내용</div>
          <div class="summary-text">${summaryText()}</div>
        </div>`;
    }

    /* ── 점수 계산 (프론트) ── */
    function calcScore(item) {
      const dist = parseInt(item['거리(m)']);
      const distScore = isNaN(dist) ? 0.5 : Math.max(0, 1 - dist / 1000);
      const price = parseInt(item['가격']);
      const priceScore = isNaN(price) ? 0.5 : Math.max(0, 1 - price / 10000);
      const rating = item['별점'];
      const ratingScore = rating != null ? Math.max(0, (rating - 2.5) / 2.5) : 0.5;
      const reviews = item['리뷰수'];
      const trust = reviews != null ? Math.min(reviews / 100, 1) : 0.3;
      const total = (distScore * 0.35) + (priceScore * 0.25) + (ratingScore * 0.25) + (trust * 0.15);
      return { total, distScore, priceScore, ratingScore, trust };
    }

    /* ── 스텝 4: 결과 ── */
    function renderStep4() {
      let items = [...state.foodData];

      if (state.maxDist && state.maxDist < 99999)
        items = items.filter(i => { const d = parseInt(i['거리(m)']); return !isNaN(d) && d <= state.maxDist; });

      if (state.maxBudget && state.maxBudget < 99999)
        items = items.filter(i => { const p = parseInt(i['가격']); return isNaN(p) || p <= state.maxBudget; });

      if (state.categories.length > 0)
        items = items.filter(i => state.categories.includes(i['대분류']));

      items.forEach(i => { i._s = calcScore(i); });
      items.sort((a, b) => b._s.total - a._s.total);
      const top = items.slice(0, 3);

      if (top.length === 0) {
        return `
          <div class="empty-state">
            <div class="empty-icon">😅</div>
            <div class="empty-text">조건에 맞는 식당이 없어요<br>조건을 바꿔보세요</div>
          </div>
          <button class="restart-btn" onclick="restart()">🔄 조건 다시 설정하기</button>`;
      }

      const rankClass = ['', 'silver', 'bronze'];
      const cards = top.map((item, i) => {
        const s = item._s;
        const emoji = CAT_EMOJI[item['대분류']] || '🍽';
        const distStr = item['거리(m)'] !== '-' ? `🚶 ${item['도보시간']} (${item['거리(m)']}m)` : '-';
        const score = Math.round(s.total * 100);
        const price = parseInt(item['가격']);
        const priceStr = !isNaN(price) ? price.toLocaleString() + '원' : '가격 미상';
        const ratingStr = item['별점'] != null ? `★ ${item['별점']}` : '-';
        const reviewStr = item['리뷰수'] != null ? `${item['리뷰수']}개` : '-';

        function miniBar(label, val, color) {
          const pct = Math.round(val * 100);
          return `
            <div class="mini-score-row">
              <span class="mini-score-label">${label}</span>
              <div class="mini-score-track">
                <div class="mini-score-fill" style="width:${pct}%;background:${color}"></div>
              </div>
              <span class="mini-score-val">${pct}</span>
            </div>`;
        }

        return `
          <div class="result-card">
            <div>
              <div class="result-rank ${rankClass[i]}">${i + 1}</div>
            </div>
            <div class="result-info">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
                <span style="font-size:26px">${emoji}</span>
                <div style="min-width:0">
                  <div class="result-name">${item['이름']}</div>
                  <div class="result-tags">
                    <span class="result-tag">${item['대분류'] || item['카테고리']}</span>
                    <span class="result-tag" style="color:#aaa">${item['출처']}</span>
                  </div>
                </div>
                <span class="result-score" style="margin-left:auto;flex-shrink:0">${score}점</span>
              </div>

              <div class="score-breakdown">
                ${miniBar('거리', s.distScore, '#34a853')}
                ${miniBar('가격', s.priceScore, '#1a73e8')}
                ${miniBar('별점', s.ratingScore, '#f59e0b')}
                ${miniBar('리뷰', s.trust, '#7c3aed')}
              </div>

              <div class="result-row" style="margin-top:8px">
                <span class="result-dist">${distStr}</span>
                <span style="font-size:11px;color:#888">${priceStr} · ${ratingStr} · 리뷰 ${reviewStr}</span>
              </div>
            </div>
          </div>`;
      }).join('');

      return `
        <div style="font-size:14px;font-weight:700;color:#111;margin-bottom:4px">추천 결과</div>
        <div style="font-size:12px;color:#888;margin-bottom:14px">${summaryText()}</div>
        ${cards}
        <button class="restart-btn" onclick="restart()">🔄 조건 바꿔서 다시 추천받기</button>`;
    }

    /* ── 렌더 ── */
    function render() {
      renderStepBar();
      const sec = document.getElementById('questionSection');
      if (state.step === 1) sec.innerHTML = renderStep1();
      else if (state.step === 2) sec.innerHTML = renderStep2();
      else if (state.step === 3) sec.innerHTML = renderStep3();
      else sec.innerHTML = renderStep4();
      renderBtns();
    }

    function renderBtns() {
      const area = document.getElementById('bottomBtns');
      if (state.step === 4) {
        area.innerHTML = `<button class="btn-next" onclick="restart()">🔄 처음부터 다시</button>`;
        return;
      }
      const ok = canNext();
      const prev = state.step > 1 ? `<div class="btn-prev" onclick="prevStep()">←</div>` : '';
      const label = state.step === 3 ? '결과 보기' : '다음 단계';
      area.innerHTML = `${prev}<button class="btn-next" onclick="nextStep()" ${ok ? '' : 'disabled'}>${label}</button>`;
    }

    function canNext() {
      if (state.step === 1) return state.situation !== null && state.maxDist !== null;
      if (state.step === 2) return state.maxBudget !== null;
      return true;
    }

    /* ── 이벤트 ── */
    function pick(key, val) {
      state[key] = val;
      render();
    }

    function toggleCat(cat) {
      const idx = state.categories.indexOf(cat);
      if (idx === -1) state.categories.push(cat);
      else state.categories.splice(idx, 1);
      render();
    }

    function nextStep() {
      if (!canNext()) return;
      state.step++;
      document.getElementById('questionSection').scrollTop = 0;
      render();
    }

    function prevStep() {
      if (state.step > 1) { state.step--; render(); }
    }

    function restart() {
      Object.assign(state, { step:1, situation:null, maxDist:null, maxBudget:null, categories:[] });
      render();
    }

    /* ── 초기화 ── */
    async function init() {
      try { state.foodData = await fetch('/api/food').then(r => r.json()); } catch {}
      render();
    }

    init();
    renderUserBadge('authArea');
  </script>
</body>
</html>
